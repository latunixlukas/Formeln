<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTG Formeltrainer</title>
<meta name="description" content="Formeln umstellen für die NTG-Prüfung Industriemeister Elektrotechnik – leicht, mittel, schwer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: Startbildschirm nur mit Knöpfen (Stufe, Themen, Los), danach Vollbild-Aufgabe wie ein Prüfungsblatt. Dunkel als Standard. Kupfer = E-Technik, Blau = Statistik. */
:root{
  --paper:#0f1418; --grid:rgba(150,185,200,.045); --card:#182027; --ink:#e6eaed; --muted:#97a2ad; --line:#2a343e;
  --cu:#e58b54; --cu-soft:#33241a; --st:#7eaaea; --st-soft:#1b2a3e;
  --ok:#5fc489; --ok-soft:#163023; --bad:#f2847a; --bad-soft:#391e1c;
  --btn:#e6eaed; --btn-fg:#0f1418;
  --b-E:#e58b54; --b-S:#7eaaea; --b-F:#b49cf0; --b-K:#e7c35a; --b-W:#ef7d8e; --b-C:#5fc4a8; --warn:#e7c35a;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --paper:#f2f3ee; --grid:rgba(60,90,80,.07); --card:#ffffff; --ink:#1c2530; --muted:#5b6571; --line:#d8dbd2;
  --cu:#b0521c; --cu-soft:#f6e6da; --st:#2a5ea8; --st-soft:#e1eaf7;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --bad:#b3261e; --bad-soft:#f8e2df;
  --btn:#1c2530; --btn-fg:#f7f7f2;
  --b-E:#b0521c; --b-S:#2a5ea8; --b-F:#6a4bbf; --b-K:#9a6a00; --b-W:#b8304a; --b-C:#1f7f68; --warn:#8a5a00; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(26px,5vw,38px)/1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font:500 13px/1.4 var(--f-body);color:var(--muted);letter-spacing:.02em;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:baseline;gap:6px;padding:6px 11px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font:800 16px/1 var(--f-display)}
.lbl{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.panel{display:grid;gap:16px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.lv strong{font:800 17px/1.1 var(--f-display)}
.lv span{font-size:12.5px;color:var(--muted);line-height:1.35}
.lv[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lv:focus-visible,.topic:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--st);outline-offset:2px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tcol{display:grid;gap:6px;align-content:start;min-width:0}
.tcol h3{margin:0;font:800 15px var(--f-display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcol h3 .q{display:flex;gap:6px}
.mini{all:unset;cursor:pointer;font:500 12px var(--f-body);color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.topic{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:13.5px;min-width:0}
.topic .code{font:800 12px/1 var(--f-display);padding:4px 6px;border-radius:5px;background:var(--paper);color:var(--muted)}
.topic .nm{min-width:0;overflow-wrap:anywhere}
.topic .pt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.card .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tag{font:600 12px/1.3 var(--f-body);padding:4px 8px;border-radius:6px;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.data{font-family:var(--f-math);font-size:17px;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.task{font-size:16px;margin:0}
.fx{font-family:var(--f-math);font-size:clamp(20px,4.4vw,27px);line-height:1.5;padding:12px 16px;background:var(--paper);border-radius:10px;overflow-x:auto;white-space:nowrap}
.fx i,.fl i,.opt i,.steps i,.legend i,.sheet i{font-family:var(--f-math);font-style:italic}
.sy sub,.fx sub{font-style:normal;font-size:.62em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{white-space:nowrap}
.given{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.given div{border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums;min-width:0}
.given div .n{display:block;font-size:12px;color:var(--muted)}
.given div .v{font-family:var(--f-math);font-size:18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--f-math);font-size:19px;background:var(--card);overflow-x:auto;white-space:nowrap;min-width:0}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.ans{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inp label{font-size:14px;min-width:0}
.inp input{font:500 17px var(--f-body);font-variant-numeric:tabular-nums;width:9.5em;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.inp input:focus{outline:2px solid var(--st);outline-offset:1px}
.inp input.ok{border-color:var(--ok);background:var(--ok-soft)} .inp input.bad{border-color:var(--bad);background:var(--bad-soft)}
.inp .u{color:var(--muted);font-size:14px}
.part{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.part:first-child{border-top:0;padding-top:0}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:8px;font:600 14px var(--f-body);background:var(--btn);color:var(--btn-fg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[hidden]{display:none!important}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.info{background:var(--paper)}
.fb strong{font:800 16px var(--f-display)}
.steps{display:grid;gap:4px;font-size:15px;font-variant-numeric:tabular-nums;overflow-x:auto}
.steps div{white-space:nowrap}
.note{font-size:13.5px;color:var(--muted)}
.traps{display:grid;gap:10px;padding:16px 18px;border-left:4px solid var(--line);background:var(--card);border-radius:0 12px 12px 0}
.traps h4{margin:0;font:800 16px var(--f-display)}
.traps p{margin:0;font-size:14px;max-width:70ch}
.traps ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px;max-width:72ch}
.sheet{display:grid;gap:16px}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.sgroup h3{margin:0;font:800 19px var(--f-display);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sgroup h3 .pt{font:500 13px var(--f-body);color:var(--muted)}
.sgroup p{margin:0;font-size:14px;color:var(--muted);max-width:75ch}
.frm{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line)}
.frm .fn{font-weight:600;font-size:14px}
.frm .fn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.frm .fl{font-family:var(--f-math);font-size:18px;display:flex;flex-wrap:wrap;gap:4px 22px;min-width:0}
.frm .fl span{white-space:nowrap}
.frm .fl .main{font-weight:600}
.prog{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:3.2em minmax(0,1fr) 7.5em;gap:10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.set{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.set input{font:500 15px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.start{max-width:720px;margin:0 auto;width:100%;display:grid;gap:22px;padding-top:4vh}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.topic.c{grid-template-columns:auto 1fr;padding:10px 12px;font-weight:500}
.go{all:unset;cursor:pointer;text-align:center;padding:16px;border-radius:12px;background:var(--cu);color:var(--paper);font:800 20px var(--f-display);letter-spacing:.01em}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.go:hover{filter:brightness(1.07)}
.hint{color:var(--bad);font-size:14px;min-height:1.2em;margin:-12px 0 0;text-align:center}
.links{justify-content:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.traps>summary{cursor:pointer;font:700 15px var(--f-display);list-style:none;display:flex;gap:8px;align-items:center}
details.traps>summary::-webkit-details-marker{display:none}
details.traps>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.traps[open]>summary::before{transform:rotate(90deg)}
.iconbtn{all:unset;cursor:pointer;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--card)}
.iconbtn:focus-visible{outline:2px solid var(--st);outline-offset:2px}
.tag{background:color-mix(in srgb,var(--bc,var(--muted)) 18%,var(--card));color:var(--bc,var(--ink))}
.tcol{--bc:var(--muted)}
.topic[aria-pressed="true"]{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 16%,var(--card))}
.topic[aria-pressed="true"] .code{background:var(--bc);color:var(--card)}
.traps{border-left-color:var(--bc,var(--line))}
.bavg{margin:-2px 0 4px;font-size:12px;color:var(--muted)}
.topics{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.levels.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.md{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.md strong{font:800 16px/1.1 var(--f-display)} .md span{font-size:12.5px;color:var(--muted);line-height:1.35}
.md[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.md:focus-visible,.th:focus-visible,.key:focus-visible{outline:2px solid var(--st);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.th{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--muted)}
.th[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.inp.big input{font-size:19px;flex:1 1 14em;width:auto;min-width:0}
.pv{font-family:var(--f-math);font-size:20px;min-height:1.6em;padding:4px 2px;overflow-x:auto;white-space:nowrap}
.warn{font-family:var(--f-body);font-size:14px;color:var(--warn)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{all:unset;cursor:pointer;min-width:2.4em;text-align:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:500 16px var(--f-body);user-select:none}
.key.var{font-family:var(--f-math);font-size:18px;border-color:color-mix(in srgb,var(--st) 45%,var(--line))}
.key:active{transform:translateY(1px)}
.guide{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.guide .lbl{margin:0}
.stp{margin:0;padding-left:22px;display:grid;gap:10px}
.stp li{display:grid;gap:3px}
.stp .ex,.phint .ex{font-size:14px;color:var(--muted);line-height:1.45}
.stp .fq{font-family:var(--f-math);font-size:19px;overflow-x:auto;white-space:nowrap}
.stp .fq.hid{font-family:var(--f-body);font-size:14px;color:var(--warn)}
.phint{padding:2px 0 0 2px}
.ptip{margin-left:4px}
h2.bh{font:800 20px var(--f-display);margin:10px 0 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
@media (max-width:640px){
  .topics{grid-template-columns:minmax(0,1fr)}
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{grid-template-columns:minmax(0,1fr)}
  .lv span{display:none}
  .lv,.md{text-align:center;padding:10px 6px}
  .lv{text-align:center;padding:10px 6px}
  .frm{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(3px)}to{transform:none}}}
</style>

<div class="wrap">
  <section id="v-start" class="start">
    <header class="top">
      <h1>NTG Formeltrainer<small>Industriemeister Elektrotechnik · Formeln umstellen</small></h1>
      <div class="chips"><span class="pill" id="pCount"><b>–</b> Tage</span>
        <div class="seg" role="group" aria-label="Farbmodus"><button class="th" data-th="light" type="button">☀︎ Hell</button><button class="th" data-th="dark" type="button">☾ Dunkel</button></div></div>
    </header>
    <div>
      <p class="lbl">Stufe</p>
      <div class="levels">
        <button class="lv" data-lv="1" aria-pressed="false"><strong>Leicht</strong><span>Formel umstellen und eintippen</span></button>
        <button class="lv" data-lv="2" aria-pressed="true"><strong>Mittel</strong><span>umstellen und ausrechnen</span></button>
        <button class="lv" data-lv="3" aria-pressed="false"><strong>Schwer</strong><span>Rechenketten wie in der Prüfung</span></button>
      </div>
    </div>
    <div>
      <p class="lbl">Erklärungen</p>
      <div class="levels two">
        <button class="md" data-md="1" aria-pressed="true"><strong>📖 Geführt</strong><span>jeder Schritt steht mit Erklärung da</span></button>
        <button class="md" data-md="0" aria-pressed="false"><strong>🎯 Selbst</strong><span>ohne Erklärung – Tipps auf Knopfdruck</span></button>
      </div>
    </div>
    <div class="topics" id="topics"></div>
    <div class="presets"><button class="btn ghost" id="preTop">Top 5 nach Punkten</button><button class="btn ghost" id="preAll">Alles</button></div>
    <button class="go" id="go" type="button">Los geht’s →</button>

  </section>

  <section id="v-train" class="panel" hidden>
    <div class="bar">
      <div class="left"><button class="btn ghost" data-view="start">← Menü</button><span class="note" id="trainInfo"></span></div>
      <div class="chips"><span class="pill">heute <b id="pToday">0/0</b></span><span class="pill">Serie <b id="pStreak">0</b></span></div>
    </div>
    <article class="card" id="card" aria-live="polite"></article>
    <details class="traps" id="traps"></details>
  </section>

  <section id="v-sheet" hidden><div class="bar" style="margin-bottom:14px"><button class="btn ghost" data-view="start">← Menü</button></div><div class="sheet" id="sheetBody"></div></section>

  <section id="v-prog" class="panel" hidden>
    <div class="bar"><button class="btn ghost" data-view="start">← Menü</button></div>
    <div class="card">
      <p class="lbl">Prüfungstermin</p>
      <div class="set">
        <label for="examDate">Datum der NTG-Prüfung</label>
        <input type="date" id="examDate">
        <span class="note">Vorbelegt mit Anfang November 2026 – trag den genauen Tag ein.</span>
      </div>
    </div>
    <div class="card">
      <p class="lbl">Richtig / falsch je Thema</p>
      <div class="prog" id="progList"></div>
      <div class="row"><button class="btn ghost" id="reset">Fortschritt zurücksetzen</button><span class="note" id="resetNote"></span></div>
    </div>
  </section>
</div>

<script>
"use strict";
/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('ntg_'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem('ntg_'+k,JSON.stringify(v))}catch(e){}}};
const r=(a,b,d=0)=>{const f=10**d;return Math.round((a+Math.random()*(b-a))*f)/f};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sig=(x,p=5)=>Number(Number(x).toPrecision(p));
const F=(x,p=4)=>isFinite(x)?sig(x,p).toLocaleString('de-DE',{maximumFractionDigits:8}):'–';
const FG=x=>F(x,5);
const SQ3='√3';

/* ---------- Winkel in Grad ---------- */
const D2R=Math.PI/180;
const sinD=a=>Math.sin(a*D2R),cosD=a=>Math.cos(a*D2R),tanD=a=>Math.tan(a*D2R);
const asinD=x=>Math.asin(x)/D2R,acosD=x=>Math.acos(x)/D2R,atanD=x=>Math.atan(x)/D2R;

/* ---------- Eingetippte Formeln lesen ---------- */
const GREEK={'ρ':'rho','η':'eta','α':'alpha','ϑ':'theta','φ':'phi','Δ':'d','Σ':'S','σ':'sigma','τ':'tau','ε':'eps','ω':'omega','μ':'mu','ν':'nu'};
const LABEL={xq:'x̄',Sx:'Σx',cosφ:'cos φ'};
const label=k=>LABEL[k]||k;
const FUNCS={arcsin:asinD,arccos:acosD,arctan:atanD,asin:asinD,acos:acosD,atan:atanD,'sin⁻¹':asinD,'cos⁻¹':acosD,'tan⁻¹':atanD,sin:sinD,cos:cosD,tan:tanD};
function aliases(f){const m=[];
  for(const k in f.v){const set=new Set([k,label(k),k.replace(/_/g,'')]);
    let a=k;for(const g in GREEK)a=a.split(g).join(GREEK[g]);set.add(a);set.add(a.replace(/_/g,''));
    if(k.includes('μ')){set.add(k.replace('μ','µ'));}
    if(k==='xq'){set.add('xquer');set.add('x_quer');set.add('x̄')}
    if(k==='cosφ'){set.add('cosφ');set.add('cosphi')}
    for(const s of set)if(s)m.push([s,'v',k])}
  for(const fn in FUNCS)m.push([fn,'f',fn]);
  return m.sort((a,b)=>b[0].length-a[0].length)}
function tokenize(f,src){
  const s=String(src).replace(/[×*⋅•]/g,'·').replace(/[:÷]/g,'/').replace(/[−–]/g,'-').replace(/,/g,'.')
    .replace(/\^2/g,'²').replace(/sqrt|wurzel/gi,'√').replace(/\bpi\b/gi,'π');
  const al=aliases(f),T=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)||c==='%'||c==='°'){i++;continue}
    if(c==='{'){const j=s.indexOf('}',i);T.push({t:'v',k:s.slice(i+1,j)});i=j+1;continue}
    if(c==='½'){T.push({t:'n',v:0.5});i++;continue}
    const mn=s.slice(i).match(/^\d+(\.\d+)?/);if(mn){T.push({t:'n',v:parseFloat(mn[0])});i+=mn[0].length;continue}
    let hit=null;for(const a of al)if(s.startsWith(a[0],i)){hit=a;break}
    if(hit){T.push(hit[1]==='v'?{t:'v',k:hit[2]}:{t:'f',k:hit[2]});i+=hit[0].length;continue}
    if('+-·/()²√π^'.includes(c)){T.push({t:c});i++;continue}
    throw new Error(`Das Zeichen „${c}“ kenne ich in dieser Formel nicht. Nutze die Knöpfe unten.`)}
  const out=[];for(const tk of T){const p=out[out.length-1];
    if(p&&['n','v',')','²','π'].includes(p.t)&&['n','v','(','√','π','f'].includes(tk.t))out.push({t:'·'});out.push(tk)}
  return out}
function parse(T){let i=0;const used=new Set();const eat=t=>{if(T[i]&&T[i].t===t){i++;return true}return false};
  function expr(){let a=term();for(;;){if(eat('+')){const b=term(),x=a;a=v=>x(v)+b(v)}else if(eat('-')){const b=term(),x=a;a=v=>x(v)-b(v)}else return a}}
  function term(){let a=unary();for(;;){if(eat('·')){const b=unary(),x=a;a=v=>x(v)*b(v)}else if(eat('/')){const b=unary(),x=a;a=v=>x(v)/b(v)}else return a}}
  function unary(){if(eat('-')){const a=unary();return v=>-a(v)}if(eat('+'))return unary();
    if(eat('√')){const a=unary();return v=>Math.sqrt(a(v))}
    if(T[i]&&T[i].t==='f'){const fn=FUNCS[T[i].k];i++;const a=unary();return v=>fn(a(v))}
    return power()}
  function power(){let a=prim();for(;;){if(eat('²')){const x=a;a=v=>x(v)**2}else if(eat('^')){const b=unary(),x=a;a=v=>x(v)**b(v)}else return a}}
  function prim(){const t=T[i];if(!t)throw new Error('Die Formel hört zu früh auf – da fehlt noch etwas.');
    if(t.t==='n'){i++;return()=>t.v}if(t.t==='π'){i++;return()=>Math.PI}
    if(t.t==='v'){i++;used.add(t.k);return v=>v[t.k]}
    if(eat('(')){const a=expr();if(!eat(')'))throw new Error('Eine Klammer ist nicht geschlossen.');return a}
    throw new Error('Zwischen zwei Zeichen fehlt eine Größe oder Zahl.')}
  const fn=expr();if(i<T.length)throw new Error(T[i].t===')'?'Da ist eine Klammer ) zu viel.':'Die Formel ist so nicht lesbar.');
  return{fn,used}}
function checkFormula(f,t,src){
  src=String(src).trim();const m=src.match(/^[^=]*=(.*)$/);if(m)src=m[1];
  if(!src.trim())throw new Error('Tippe zuerst eine Formel ein.');
  const {fn,used}=parse(tokenize(f,src));
  if(used.has(t))return{ok:false,msg:`${sym(f,t)} darf rechts nicht mehr vorkommen – es soll ja allein links stehen.`};
  for(let k=0;k<8;k++){const raw=f.gen(),c=f.s[t][1](raw),u=fn(raw);
    if(!isFinite(u)||Math.abs(u-c)>1e-6*Math.max(1,Math.abs(c)))return{ok:false}}
  return{ok:true}}
function preview(f,src){
  try{const s=String(src).replace(/^[^=]*=/,'');if(!s.trim())return '&nbsp;';
    return tokenize(f,s).map(x=>x.t==='v'?`<span class="sy">${sym(f,x.k)}</span>`:x.t==='n'?F(x.v,10):x.t==='f'?x.k+' ':
      ({'·':' · ','/':' / ','+':' + ','-':' − '})[x.t]||x.t).join('')}
  catch(e){return `<span class="warn">${e.message}</span>`}}

const OPX={
 '÷':X=>`Beide Seiten durch ${X} teilen. So fällt ${X} auf der Seite weg, wo es malgenommen war.`,
 '·':X=>`Beide Seiten mit ${X} malnehmen. So verschwindet das „geteilt durch ${X}“.`,
 '+':X=>`Auf beiden Seiten ${X} dazuzählen. So fällt das „− ${X}“ weg.`,
 '−':X=>`Auf beiden Seiten ${X} abziehen. So fällt das „+ ${X}“ weg.`,
 '√':()=>'Auf beiden Seiten die Wurzel ziehen. Wurzel und Quadrat heben sich auf.',
 '²':()=>'Beide Seiten hoch 2 nehmen (quadrieren). Quadrat und Wurzel heben sich auf.',
 '⇄':()=>'Seiten tauschen, damit die gesuchte Größe links steht. Fertig umgestellt.',
};
function umSteps(f,t){
  const rhs=f.s[t][0],fin=`{${t}} = ${rhs}`,lhs=f.eq.split(' = ')[0];
  if(lhs==='{'+t+'}')return[{txt:`${sym(f,t)} steht schon allein links. Hier musst du nichts umstellen.`,eq:tex(f,f.eq)}];
  const out=[{txt:`Ausgangsformel. Gesucht ist ${sym(f,t)} – am Ende muss ${sym(f,t)} allein auf einer Seite stehen.`,eq:tex(f,f.eq)}];
  const xs=(f.x&&f.x[t])||[['!Umstellen nach '+sym(f,t)+':',fin]];
  for(const st_ of xs){const op=st_[0],c=op[0],X=op.slice(1);
    const txt=c==='!'?tex(f,X):OPX[c](X?tex(f,X):'');out.push({txt,eq:tex(f,st_[1]||fin)})}
  if(xs.length&&(xs[xs.length-1][1]||fin)!==fin)out.push({txt:'Seiten tauschen bzw. ordnen. Fertig umgestellt.',eq:tex(f,fin)});
  return out}

/* ---------- Darstellung von Formeln ---------- */
function sym(f,k){const d=f.v[k]&&f.v[k][2];if(d)return d;const m=k.match(/^([^_]+)(?:_(.+))?$/);return `<i>${m[1]}</i>`+(m[2]?`<sub>${m[2]}</sub>`:'')}
const tex=(f,t)=>t.replace(/\{([^}]+)\}/g,(_,k)=>`<span class="sy">${sym(f,k)}</span>`);
const unit=(f,k)=>f.v[k][1]?' '+f.v[k][1]:'';
const num=(f,t,v)=>t.replace(/\{([^}]+)\}/g,(_,k)=>FG(v[k])+unit(f,k));
const parseNum=s=>{s=String(s).trim().replace(/[−–]/g,'-').replace(/\s/g,'').replace(/[^\d,.\-+eE]/g,'');
  if(/,/.test(s)){s=s.replace(/\./g,'').replace(',','.')}return s===''?NaN:Number(s)};
const near=(a,t,tol)=>isFinite(a)&&(tol!=null?Math.abs(a-t)<=tol:Math.abs(a-t)<=Math.max(Math.abs(t)*0.02,1e-9));

 ()=>{const l=r(50,150,0),d=pick([0.2,0.3,0.4]),T=pick([70,80,90,100]),U=24,ρ=0.0179,α=0.0039;

 ()=>{const P=pick([3000,4000,5500]),η=pick([0.8,0.85]),n=pick([1400,1450]),i=pick([25,40,50]),d=pick([0.2,0.3,0.4]),I=pick([6.5,8,11]),c=pick([0.77,0.8,0.85]);

/* ---------- Tipps für die schweren Aufgaben (je Teilaufgabe) ---------- */
const HINTS={
'Verbraucher an langer Anschlussleitung':['Typenschild: <i>R</i><sub>V</sub> = <i>U</i>² / <i>P</i>. Die Nennleistung gilt bei 230 V.','Leitung: <i>R</i><sub>L</sub> = 2 · <i>ρ</i> · <i>l</i> / <i>A</i>. Die 2, weil der Strom hin UND zurück fließt.','Verbraucher und Leitung liegen in Reihe: erst <i>R</i><sub>ges</sub> = <i>R</i><sub>V</sub> + <i>R</i><sub>L</sub>, dann <i>I</i> = <i>U</i> / <i>R</i><sub>ges</sub>.','Erst den Spannungsfall auf der Leitung: <i>U</i><sub>L</sub> = <i>I</i> · <i>R</i><sub>L</sub>. Dann <i>U</i><sub>K</sub> = <i>U</i> − <i>U</i><sub>L</sub>.','Mit der echten Spannung am Gerät rechnen: <i>P</i> = <i>U</i><sub>K</sub> · <i>I</i>.'],
'Lampe an Verlängerungsleitung':['Lampenwiderstand aus den Nennwerten: <i>R</i> = <i>U</i>² / <i>P</i>.','Hin- und Rückleitung liegen mit der Lampe in Reihe: <i>R</i> = <i>R</i><sub>La</sub> + 2 · <i>R</i><sub>Ltg</sub>, dann <i>I</i> = <i>U</i> / <i>R</i>.','Leistung an der Lampe: <i>P</i> = <i>I</i>² · <i>R</i><sub>La</sub> – nur der Lampenwiderstand, nicht der ganze Kreis.'],
'Sonderwiderstand aus Konstantan':['<i>P</i> = <i>I</i>² · <i>R</i> nach <i>I</i> umstellen: <i>I</i> = √(<i>P</i> / <i>R</i>).','Runddraht: <i>A</i> = <i>d</i>² · π / 4 (d in mm → A in mm²).','<i>R</i> = <i>ρ</i> · <i>l</i> / <i>A</i> nach <i>l</i> umstellen: <i>l</i> = <i>R</i> · <i>A</i> / <i>ρ</i>.','Größter erlaubter Widerstand = <i>R</i> + 10 %. Dann <i>U</i> = <i>I</i> · <i>R</i><sub>max</sub> mit 0,1 A.'],
'Heizdraht im Heißwasserbereiter':['Widerstand aus Spannung und Leistung: <i>R</i> = <i>U</i>² / <i>P</i>.','<i>l</i> = <i>R</i> · <i>A</i> / <i>ρ</i> mit ρ<sub>Konstantan</sub> = 0,49 Ω·mm²/m.'],
'Heizung mit zwei Heizwiderständen':['Nur ein Widerstand an 230 V: <i>P</i> = <i>U</i>² / <i>R</i>.','Reihe: Widerstände addieren, dann <i>P</i> = <i>U</i>² / <i>R</i><sub>ges</sub>.','Parallel: <i>R</i><sub>ges</sub> = <i>R</i><sub>1</sub> · <i>R</i><sub>2</sub> / (<i>R</i><sub>1</sub> + <i>R</i><sub>2</sub>) – oder einfach <i>P</i><sub>1</sub> + <i>P</i><sub>2</sub>.','Arbeit <i>W</i> = <i>P</i> · <i>t</i> in kWh (W ÷ 1000), dann mal Preis.'],
'Ofen am Stromzähler':['Umdrehungen ÷ Zählerkonstante = Arbeit in kWh. Dann <i>P</i> = <i>W</i> / <i>t</i> mit t in Stunden.','<i>R</i> = <i>U</i>² / <i>P</i>.','Drei gleiche parallel: <i>R</i><sub>ges</sub> = <i>R</i><sub>1</sub> / 3 → <i>R</i><sub>1</sub> = 3 · <i>R</i><sub>ges</sub>.','In Reihe: <i>R</i> = 3 · <i>R</i><sub>1</sub>, dann <i>P</i> = <i>U</i>² / <i>R</i>. Ergebnis: ein Neuntel.'],
'Gemischte Schaltung':['Von innen nach außen: erst <i>R</i><sub>2</sub> + <i>R</i><sub>4</sub>, dann parallel zu <i>R</i><sub>3</sub>, dann <i>R</i><sub>1</sub> dazu.','<i>I</i> = <i>U</i> / <i>R</i><sub>ges</sub>.','Spannung an <i>R</i><sub>1</sub> abziehen: <i>U</i><sub>3</sub> = <i>U</i> − <i>I</i> · <i>R</i><sub>1</sub>.','<i>P</i> = <i>U</i><sub>3</sub>² / <i>R</i><sub>3</sub>.'],
'NTC im Spannungsteiler – rückwärts':['Erst die Spannung an <i>R</i><sub>1</sub>: <i>U</i><sub>EIN</sub> − <i>U</i><sub>AUS</sub>. Dann <i>R</i><sub>2</sub> = <i>R</i><sub>1</sub> · <i>U</i><sub>AUS</sub> / <i>U</i><sub>R1</sub>.','Reihe: <i>I</i> = <i>U</i><sub>EIN</sub> / (<i>R</i><sub>1</sub> + <i>R</i><sub>2</sub>).','<i>P</i> = <i>I</i>² · <i>R</i><sub>1</sub>.'],
'Kupferspule wird warm':['<i>A</i> = <i>d</i>² · π / 4, dann <i>R</i><sub>20</sub> = <i>ρ</i> · <i>l</i> / <i>A</i>.','<i>R</i><sub>ϑ</sub> = <i>R</i><sub>20</sub> · (1 + <i>α</i> · Δ<i>ϑ</i>) mit Δϑ = Endtemperatur − 20 °C.','Beide Ströme mit <i>I</i> = <i>U</i> / <i>R</i>, dann die Differenz.'],
'Ventilspule mit NTC und Vorwiderstand':['Der Strom kommt aus der Spule: <i>I</i> = <i>P</i> / <i>U</i> = <i>P</i> / 24 V. In Reihe ist er überall gleich.','<i>U</i><sub>R1</sub> = <i>I</i> · <i>R</i><sub>1</sub>.','Restspannung für den NTC: 200 V − <i>U</i><sub>R1</sub> − 24 V. Dann <i>R</i><sub>2</sub> = <i>U</i><sub>R2</sub> / <i>I</i>.','<i>R</i> = <i>U</i> / <i>I</i> mit den Spulenwerten.'],
'Kran hebt eine Last':['Hubleistung: <i>P</i> = <i>m</i> · <i>g</i> · <i>h</i> / <i>t</i> (t in s).','Der Motor muss mehr aufnehmen: <i>P</i><sub>zu</sub> = <i>P</i><sub>ab</sub> / <i>η</i>.','<i>P</i> = √3 · <i>U</i> · <i>I</i> · cos <i>φ</i> nach <i>I</i> umstellen.'],
'Stern oder Dreieck':['Stern: <i>U</i><sub>Str</sub> = 400 V / √3.','<i>I</i><sub>Str</sub> = <i>U</i><sub>Str</sub> / <i>R</i>.','Drei Stränge: <i>P</i> = 3 · <i>U</i><sub>Str</sub> · <i>I</i><sub>Str</sub>.','Dreieck: jeder Strang hat 400 V, also <i>P</i> = 3 · (400 V)² / <i>R</i>.'],
'Förderband mit Getriebe':['Getriebeausgang: <i>P</i><sub>ab</sub> = <i>P</i><sub>Motor</sub> · <i>η</i><sub>Getriebe</sub>.','Erst die Rollendrehzahl <i>n</i> / <i>i</i>, in 1/s umrechnen (÷ 60), dann <i>v</i> = <i>d</i> · π · <i>n</i>.','<i>P</i> = <i>F</i> · <i>v</i> → <i>F</i> = <i>P</i> / <i>v</i>.','<i>P</i><sub>zu</sub> = √3 · <i>U</i> · <i>I</i> · cos <i>φ</i>, dann <i>η</i> = <i>P</i><sub>ab</sub> / <i>P</i><sub>zu</sub>.'],
'Warmwasserspeicher':['<i>W</i> = <i>P</i> · <i>t</i> mit t in Sekunden. W in Ws = J, ÷ 1000 → kJ.','Δ<i>ϑ</i> = <i>Q</i> / (<i>m</i> · <i>c</i>), 1 l Wasser = 1 kg.'],
'Akku mit zwei Lastpunkten':['<i>R</i><sub>i</sub> = (<i>U</i><sub>1</sub> − <i>U</i><sub>2</sub>) / (<i>I</i><sub>2</sub> − <i>I</i><sub>1</sub>) – die Differenzen über Kreuz.','Leerlauf: <i>U</i><sub>0</sub> = <i>U</i><sub>1</sub> + <i>I</i><sub>1</sub> · <i>R</i><sub>i</sub>.','<i>W</i> = <i>U</i> · <i>I</i> · <i>t</i>, 10 min = 1/6 h.','<i>R</i> = <i>U</i> / <i>I</i> mit dem zweiten Lastpunkt.'],
'Werkstattbeleuchtung und Heizlüfter':['Leistungen addieren, dann <i>I</i> = <i>P</i> / <i>U</i>.','<i>t</i> = <i>W</i> / <i>P</i> – P vorher in kW umrechnen.','<i>W</i> = <i>P</i> · <i>t</i> in kWh, dann mal Preis.'],
'Tage auswerten':['Alle Häufigkeiten zusammenzählen.','Gewogener Mittelwert: Σ(Wert · Anzahl) / Σ Anzahl.','Summe aller Tage / (Mitarbeiter · 200 Tage) · 100 %.','<i>R</i> = größter Wert − kleinster Wert.'],
'Fehlende Häufigkeit aus dem Mittelwert':['Mittelwert-Formel mit <i>x</i> für die fehlende Anzahl aufschreiben, mit dem Nenner malnehmen, nach <i>x</i> auflösen.','Alle Anzahlen zusammenzählen.'],
'Urliste: Modalwert, Median, Mittelwert':['Der Wert, der am häufigsten vorkommt.','Erst sortieren. Ungerade Anzahl: der mittlere Wert. Gerade: Mittel der beiden mittleren.','Alle Werte addieren und durch ihre Anzahl teilen.'],
'Messreihe: s und Streugrenzen':['Alle Werte addieren, durch n teilen.','<i>s</i> = √(Σ(<i>x</i><sub>i</sub> − <i>x̄</i>)² / (<i>n</i> − 1)) – oder die s-Taste am Taschenrechner.','99,73 % ≙ <i>x̄</i> + 3s.','99,73 % ≙ <i>x̄</i> − 3s.'],
'Wuchtgewichte: Lage und Streuung beurteilen':['<i>x̄</i> + 3 · <i>s</i>.','<i>x̄</i> − 3 · <i>s</i>.','6s = 6 · <i>s</i>, mit der Toleranz T = 6 g vergleichen.','Wendepunkt = <i>x̄</i> + 1 · <i>s</i>.'],
'Wahrscheinlichkeitsnetz auswerten':['<i>s</i> = Wert bei 50 % − Wert bei 15,87 %.','95,45 % ≙ <i>x̄</i> ± 2s.','<i>x̄</i> + 2s.','Ausschussanteile addieren, dann Anzahl = N · p / 100 %.'],
'Stichprobe für die Regelkarte':['Sortieren, bei n = 5 der dritte Wert.','<i>R</i> = größter − kleinster Wert.','Alle fünf addieren, durch 5 teilen.'],
'Urwertkarte: Maschine richtig einstellen':['OGW = Nennmaß + obere Abweichung.','UGW = Nennmaß − untere Abweichung.','<i>C</i> = (OGW + UGW) / 2.','Verstellung = Ziel <i>C</i> − aktuelle Lage <i>x̄</i>.'],
'Cp und Cpk bestimmen':['<i>T</i> = OGW − UGW, dann <i>C</i><sub>p</sub> = <i>T</i> / (6s).','Beide Seiten rechnen: (OGW − <i>x̄</i>)/(3s) und (<i>x̄</i> − UGW)/(3s). Der kleinere Wert ist <i>C</i><sub>pk</sub>.'],
'Toleranz aus der Forderung':['<i>C</i><sub>p</sub> = <i>T</i> / (6s) nach <i>T</i> umstellen: <i>T</i> = <i>C</i><sub>p</sub> · 6 · <i>s</i>.','Cpk = Cp heißt: µ liegt genau in der Mitte. OGW = µ + T/2.','UGW = µ − T/2.'],
'Klassen bilden':['<i>k</i> = √<i>n</i>.','<i>R</i> = <i>x</i><sub>max</sub> − <i>x</i><sub>min</sub>.','<i>w</i> = <i>R</i> / <i>k</i>, danach aufrunden.'],
'Galvanisches Element':['Edleres Metall = höheres (positiveres) Potenzial. <i>U</i> = <i>E</i><sub>edel</sub> − <i>E</i><sub>unedel</sub>. Minus mal Minus gibt Plus.','Gleiche Regel: höheres Potenzial minus niedrigeres.'],
'Winkelprofil mit Bohrung':['<i>V</i> = <i>S</i> · <i>l</i> in dm³ (cm² ÷ 100 = dm², m · 10 = dm). Dann <i>m</i> = <i>V</i> · <i>ρ</i>.','cm² · 100 = mm². <i>σ</i> = <i>F</i> / <i>S</i>.','Das Loch nimmt im Schnitt ein Rechteck <i>d</i> · <i>t</i> weg: <i>S</i><sub>neu</sub> = <i>S</i> − <i>d</i> · <i>t</i>.','Gleiche Kraft, kleinere Fläche: <i>σ</i> = <i>F</i> / <i>S</i><sub>neu</sub>.'],
'Zugstange bei schwellender Belastung':['Schwellend: <i>σ</i><sub>zul</sub> = ⅓ · <i>R</i><sub>e</sub>.','<i>S</i><sub>erf</sub> = <i>F</i> / <i>σ</i><sub>zul</sub> (F in N).','Quadrat: <i>S</i> = <i>a</i>², also <i>a</i> = √<i>S</i>.'],
'Rohr als Druckstütze':['<i>d</i> = <i>D</i> − 2 · Wanddicke.','Kreisring: <i>S</i> = π/4 · (<i>D</i>² − <i>d</i>²).','<i>σ</i> = <i>F</i> / <i>S</i> (kN · 1000 = N).'],
'Stanzen: Platte mit Loch':['Alle Schnittlinien zusammen: Rechteckumfang 2 · (a + b) plus Lochumfang π · d.','<i>S</i> = <i>U</i> · <i>t</i>.','<i>F</i> = <i>S</i> · <i>τ</i>, dann ÷ 1000 für kN.'],
'Wie viele Niete?':['<i>S</i><sub>erf</sub> = <i>F</i> / <i>τ</i><sub>zul</sub>.','<i>S</i><sub>N</sub> = π · <i>d</i>² / 4.','<i>n</i> = <i>S</i><sub>erf</sub> / <i>S</i><sub>N</sub>, immer aufrunden.'],
'Stahlstab wird gezogen':['<i>S</i> = π · <i>d</i>² / 4.','<i>σ</i> = <i>F</i> / <i>S</i>.','Hooke: <i>σ</i> = <i>E</i> · <i>ε</i> → <i>ε</i> = <i>σ</i> / <i>E</i>.','Δ<i>L</i> = <i>ε</i> · <i>L</i><sub>0</sub> (L₀ in mm).'],
'Pedal auf Hydraulikkolben':['Hebelgesetz: <i>F</i><sub>1</sub> · <i>l</i><sub>1</sub> = <i>F</i><sub>2</sub> · <i>l</i><sub>2</sub> nach <i>F</i><sub>2</sub> umstellen.','<i>A</i> = <i>d</i>² · π / 4 mit d in cm.','<i>p</i> = <i>F</i> / <i>A</i> in N/cm², dann ÷ 10 für bar.'],
'Last die Rampe hinaufziehen':['tan <i>α</i> = Steigung / 100, dann arctan.','<i>F</i><sub>G</sub> = <i>m</i> · <i>g</i>, dann <i>F</i><sub>H</sub> = <i>F</i><sub>G</sub> · sin <i>α</i>.','<i>F</i><sub>N</sub> = <i>F</i><sub>G</sub> · cos <i>α</i>, dann <i>F</i><sub>R</sub> = <i>µ</i> · <i>F</i><sub>N</sub>.','Bergauf: <i>F</i><sub>Z</sub> = <i>F</i><sub>H</sub> + <i>F</i><sub>R</sub>.'],
'Rutscht oder kippt die Kiste?':['Rutschgrenze: tan <i>α</i> = <i>µ</i>.','Kippgrenze: tan <i>α</i> = waagerechter / senkrechter Schwerpunktabstand. Der kleinere Winkel tritt zuerst ein.'],
'Kommt der Pkw rechtzeitig zum Stehen?':['km/h ÷ 3,6.','<i>s</i><sub>R</sub> = <i>v</i> · <i>t</i><sub>R</sub>.','Bremszeit gegeben: <i>s</i> = ½ · <i>v</i> · <i>t</i>.','Reaktionsweg + Bremsweg, dann mit dem Abstand vergleichen.','<i>a</i> = <i>v</i> / <i>t</i><sub>Brems</sub>.'],
'Hindernis in der Stadt':['Erst km/h ÷ 3,6, dann <i>s</i><sub>R</sub> = <i>v</i> · 1 s.','Verzögerung gegeben: <i>s</i> = <i>v</i>² / (2 · <i>a</i>).','Beide Wege addieren und mit dem Abstand vergleichen.'],
'Last fällt herunter':['<i>E</i><sub>pot</sub> = <i>m</i> · <i>g</i> · <i>h</i>.','<i>E</i><sub>pot</sub> = <i>E</i><sub>kin</sub> → <i>v</i> = √(2 · <i>g</i> · <i>h</i>). Die Masse kürzt sich raus.','m/s · 3,6 = km/h.'],
'Wann schleudert es aus der Kurve?':['Fliehkraft = Reibkraft: <i>m</i> · <i>v</i>² / <i>r</i> = <i>µ</i> · <i>m</i> · <i>g</i> → <i>v</i> = √(<i>µ</i> · <i>g</i> · <i>r</i>).','m/s · 3,6 = km/h.'],
'Rotierende Scheibe':['min⁻¹ ÷ 60 = s⁻¹, dann <i>ω</i> = 2 · π · <i>n</i>.','<i>v</i> = <i>ω</i> · <i>r</i> mit r = d / 2.','<i>M</i> = <i>P</i> / <i>ω</i>.','<i>F</i><sub>z</sub> = <i>m</i> · <i>ω</i>² · <i>r</i>.'],
'Seilwinde zieht eine Last':['<i>W</i> = <i>F</i> · <i>s</i>.','<i>P</i> = <i>W</i> / <i>t</i>.','<i>P</i><sub>zu</sub> = <i>P</i><sub>ab</sub> / <i>η</i>.'],
'Wie lange braucht das Wasser?':['1 l Wasser = 1 kg. <i>Q</i> = <i>m</i> · <i>c</i> · Δ<i>T</i> mit c = 4,18 kJ/(kg·K).','Mehr Energie nötig als ankommt: <i>E</i><sub>zu</sub> = <i>Q</i> / <i>η</i>.','<i>t</i> = <i>E</i> / <i>P</i>: kJ geteilt durch kW gibt Sekunden. Dann in min und s zerlegen.'],
'Wirkungsgrad eines Dieselmotors':['<i>W</i> = <i>P</i> · <i>t</i>: kW mal s gibt kJ.','<i>m</i> = <i>V</i> · <i>ρ</i> (Liter = dm³).','<i>Q</i> = <i>m</i> · <i>H</i><sub>i</sub>.','<i>η</i> = <i>W</i><sub>ab</sub> / <i>Q</i><sub>zu</sub>.'],
'Wie viel Heizöl wird gebraucht?':['<i>Q</i> = <i>m</i> · <i>c</i> · Δ<i>T</i>, 1 l Wasser = 1 kg.','Verlust 30 % → <i>η</i> = 0,7. <i>Q</i><sub>zu</sub> = <i>Q</i> / <i>η</i>.','<i>m</i> = <i>Q</i><sub>zu</sub> / <i>H</i><sub>i</sub>, dann <i>V</i> = <i>m</i> / <i>ρ</i>.'],
'Wie viel Platz braucht die Dehnfuge?':['Endtemperatur minus Anfangstemperatur (Vorzeichen beachten).','Δ<i>L</i> = <i>L</i><sub>0</sub> · <i>α</i> · Δ<i>T</i> mit L₀ in mm.'],
'Gas wird verdichtet und erwärmt':['<i>T</i> = <i>ϑ</i> + 273,15.','<i>T</i> = <i>ϑ</i> + 273,15.','<i>p</i><sub>1</sub> · <i>V</i><sub>1</sub> / <i>T</i><sub>1</sub> = <i>p</i><sub>2</sub> · <i>V</i><sub>2</sub> / <i>T</i><sub>2</sub> nach <i>p</i><sub>2</sub> umstellen.'],
'Differentialzylinder':['<i>A</i><sub>1</sub> = <i>D</i>² · π / 4.','<i>Q</i> in cm³/min (l · 1000), dann <i>v</i> = <i>Q</i> / <i>A</i><sub>1</sub>.','Einfahren: Ringfläche (<i>D</i>² − <i>d</i>²) · π / 4, dann <i>v</i> = <i>Q</i> / <i>A</i><sub>2</sub>.','<i>v</i><sub>1</sub> / <i>v</i><sub>2</sub> = <i>A</i><sub>2</sub> / <i>A</i><sub>1</sub>.'],
};
const hintFor=t=>HINTS[t]||HINTS[Object.keys(HINTS).find(k=>t.endsWith(k))]||[];

/* ---------- Zustand ---------- */
for(const f of FX)f.x=XS[f.id];
const st={lv:store.get('lv',2),guided:store.get('guided',true),sel:new Set(store.get('sel',['E1','E3','E4','S1','S2']).filter(g=>GMAP[g])),cur:null,done:false,streak:0};
let stats=store.get('stats',{}),fst=store.get('fst',{});
let day=store.get('day',{d:'',r:0,w:0});
const today=new Date().toISOString().slice(0,10);
if(day.d!==today)day={d:today,r:0,w:0};

function record(ok,g,fid){
  stats[g]=stats[g]||{r:0,w:0};stats[g][ok?'r':'w']++;
  if(fid){fst[fid]=fst[fid]||{r:0,w:0};fst[fid][ok?'r':'w']++}
  day[ok?'r':'w']++;st.streak=ok?st.streak+1:0;
  store.set('stats',stats);store.set('fst',fst);store.set('day',day);updHead();
}
function updHead(){
  $('#pToday').textContent=`${day.r}/${day.r+day.w}`;$('#pStreak').textContent=st.streak;
  const ed=store.get('exam','2026-11-03'),diff=Math.ceil((new Date(ed+'T08:00:00')-new Date())/864e5);
  $('#pCount').innerHTML=diff>=0?`<b>${diff}</b> Tage bis zur Prüfung`:'<b>✓</b> Prüfung vorbei';
}

/* ---------- Startbildschirm ---------- */
function buildTopics(){
  $('#topics').innerHTML=BLOCKS.map(B=>`<div class="tcol" style="--bc:var(--b-${B.id})"><h3><span>${B.e} ${B.name}</span><span class="q"><button class="mini" data-all="${B.id}">alle</button><button class="mini" data-none="${B.id}">keine</button></span></h3><p class="bavg">${B.avg}</p><div class="tgrid">${
    GROUPS.filter(g=>g.b===B.id).map(g=>`<button class="topic c" data-g="${g.id}" aria-pressed="${st.sel.has(g.id)}" title="${g.name}"><span class="code">${g.id}</span><span class="nm">${g.e} ${g.sn}</span></button>`).join('')}</div></div>`).join('');
  document.querySelectorAll('.topic').forEach(el=>el.onclick=()=>{const g=el.dataset.g;st.sel.has(g)?st.sel.delete(g):st.sel.add(g);selChanged()});
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{GROUPS.filter(g=>g.b===b.dataset.all).forEach(g=>st.sel.add(g.id));selChanged()});
  document.querySelectorAll('[data-none]').forEach(b=>b.onclick=()=>{GROUPS.filter(g=>g.b===b.dataset.none).forEach(g=>st.sel.delete(g.id));selChanged()});
}
function selChanged(){store.set('sel',[...st.sel]);document.querySelectorAll('.topic').forEach(t=>t.setAttribute('aria-pressed',st.sel.has(t.dataset.g)));$('#hint').textContent=''}
$('#preTop').onclick=()=>{st.sel=new Set(['E3','S1','S2','E4','E1']);selChanged()};
$('#preAll').onclick=()=>{st.sel=new Set(GROUPS.map(g=>g.id));selChanged()};
function setPressed(sel,attr,val){document.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x.dataset[attr]===String(val)))}
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{st.lv=+b.dataset.lv;store.set('lv',st.lv);setPressed('.lv','lv',st.lv)});
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{st.guided=b.dataset.md==='1';store.set('guided',st.guided);setPressed('.md','md',st.guided?1:0)});
setPressed('.lv','lv',st.lv);setPressed('.md','md',st.guided?1:0);

/* ---------- Aufgaben auswählen ---------- */
const weight=id=>{const s=fst[id]||{r:0,w:0};return Math.max(0.4,1+s.w*0.8-s.r*0.25)};
function wpick(items,wf){const ws=items.map(wf),sum=ws.reduce((a,b)=>a+b,0);let x=Math.random()*sum;for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i]}return items[items.length-1]}
function next(){
  const groups=[...st.sel];st.done=false;st.tries=0;st.revealed=false;
  if(st.lv===3){
    const g=wpick(groups.filter(x=>SCH[x]),x=>{const s=stats[x]||{r:0,w:0};return Math.max(0.5,1+s.w*0.3-s.r*0.1)});
    st.cur={kind:3,g,t:pick(SCH[g])()};renderHard();
  }else{
    const pool=FX.filter(f=>st.sel.has(f.g));const f=wpick(pool,x=>weight(x.id));
    let ts=Object.keys(f.s);if(st.lv===1){const lhs=f.eq.split(' = ')[0];const nl=ts.filter(t=>lhs!=='{'+t+'}');if(nl.length)ts=nl}
    const target=pick(ts);const raw=f.gen();const v={};for(const k in raw)v[k]=sig(raw[k]);
    v[target]=f.s[target][1](v);
    st.cur={kind:st.lv,g:f.g,f,target,v};st.lv===1?renderEasy():renderMid();
  }
  renderTraps(st.cur.g);window.scrollTo(0,0);
}

/* ---------- Bausteine ---------- */
const head=(g,extra='')=>{const G=GMAP[g];return `<div class="head"><span class="tag" style="--bc:var(--b-${G.b})">${G.e} ${G.id} · ${G.name}</span><span class="note">${extra}</span></div>`};
const legend=f=>`<div class="legend">${Object.keys(f.v).map(k=>`<span>${sym(f,k)} = ${f.v[k][0]}${f.v[k][1]?' in '+f.v[k][1]:''}</span>`).join('')}</div>`;
const stepList=(arr,start=1,hideLastEq=false)=>`<ol class="stp" start="${start}">${arr.map((s,i)=>`<li><span class="ex">${s.txt}</span>${hideLastEq&&i===arr.length-1?'<span class="fq hid">? – das ist dein Teil</span>':`<span class="fq">${s.eq}</span>`}</li>`).join('')}</ol>`;
const mode=()=>st.guided?'geführt':'selbst';
function bottomRow(extra=''){return `<div class="row"><button class="btn" type="submit" id="chk">Prüfen ↵</button><button class="btn ghost" type="button" id="tip">💡 Tipp</button><button class="btn ghost" type="button" id="sol">Lösung zeigen</button>${extra}<button class="btn ghost" type="button" id="skip">Weiter →</button></div>`}
function finish(ok,first){st.done=true;if(first)record(ok,st.cur.g,st.cur.f?st.cur.f.id:null);
  $('#chk').textContent='Nächste Aufgabe ↵';$('#tip').hidden=true;$('#sol').hidden=true;$('#skip').hidden=true;$('#chk').focus({preventScroll:true})}
const isTouch=()=>matchMedia('(pointer:coarse)').matches;

/* ---------- Leicht: Formel umstellen und eintippen ---------- */
function renderEasy(){
  const {f,target:t,v}=st.cur,c=$('#card'),steps=umSteps(f,t),keys=Object.keys(f.v).filter(k=>k!==t);let shown=st.guided?steps.length-1:0;
  const ops=['+','−','·','/','(',')','²','√','π'];if(/sin|cos|tan/.test(f.eq))ops.push('sin','cos','tan','arcsin','arccos','arctan');
  c.innerHTML=head(f.g,`${f.name} · Leicht · ${mode()}`)+
   `<p class="task">Stelle nach <b>${sym(f,t)}</b> um und <b>tippe die Formel ein</b>.</p><div class="fx">${tex(f,f.eq)}</div>${legend(f)}
    <div id="guide"></div>
    <form class="ans" id="frm" autocomplete="off">
      <div class="inp big"><label for="fin">${sym(f,t)} =</label><input id="fin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="hier tippen oder Knöpfe nutzen"></div>
      <div class="pv" id="pv" aria-live="polite">&nbsp;</div>
      <div class="keys">${keys.map(k=>`<button type="button" class="key var" data-ins="${label(k)}">${sym(f,k)}</button>`).join('')}${ops.map(o=>`<button type="button" class="key" data-ins="${o.length>1?o+'(':o}">${o}</button>`).join('')}<button type="button" class="key" data-del="1" aria-label="Zeichen löschen">⌫</button><button type="button" class="key" data-clr="1">C</button></div>
      ${bottomRow()}
    </form><div id="fb"></div>`;
  const inp=$('#fin');let pos=0;
  const upd=()=>{$('#pv').innerHTML=preview(f,inp.value)};
  inp.addEventListener('input',()=>{pos=inp.selectionStart;upd()});inp.addEventListener('keyup',()=>pos=inp.selectionStart);inp.addEventListener('click',()=>pos=inp.selectionStart);
  c.querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(st.done)return;const val=inp.value;
    if(b.dataset.clr){inp.value='';pos=0}
    else if(b.dataset.del){if(pos>0){inp.value=val.slice(0,pos-1)+val.slice(pos);pos--}}
    else{const s=b.dataset.ins;inp.value=val.slice(0,pos)+s+val.slice(pos);pos+=s.length}
    upd();if(!isTouch()){inp.focus();inp.setSelectionRange(pos,pos)}});
  const showGuide=()=>{const g=$('#guide');
    if(!shown){g.innerHTML='';return}
    const part=steps.slice(0,shown);g.innerHTML=`<div class="guide"><p class="lbl">${st.guided?'Schritt für Schritt':'Tipp'}</p>${stepList(part)}${shown<steps.length?`<p class="note">Letzter Schritt: ${steps[shown].txt} Das Ergebnis tippst du selbst ein.</p>`:''}</div>`};
  showGuide();
  $('#tip').onclick=()=>{if(shown<steps.length-1){shown++;showGuide()}else{$('#fb').innerHTML=`<div class="fb info">Mehr Tipps gibt es nicht – drück „Lösung zeigen“, wenn du nicht weiterkommst.</div>`}};
  $('#sol').onclick=()=>{shown=steps.length;showGuide();$('#fb').innerHTML=`<div class="fb bad"><strong>Lösung</strong><div class="steps"><div>${sym(f,t)} = ${tex(f,f.s[t][0])}</div><div class="note">Probe: ${sym(f,t)} = ${num(f,f.s[t][0],v)} = ${F(v[t])}${unit(f,t)}</div></div></div>`;finish(false,st.tries===0)};
  $('#skip').onclick=next;
  $('#frm').onsubmit=e=>{e.preventDefault();if(st.done){next();return}
    let res;try{res=checkFormula(f,t,inp.value)}catch(err){$('#fb').innerHTML=`<div class="fb info">${err.message}</div>`;return}
    const first=st.tries===0;st.tries++;
    if(res.ok){inp.classList.remove('bad');inp.classList.add('ok');shown=steps.length;showGuide();
      $('#fb').innerHTML=`<div class="fb ok"><strong>Richtig${first?'':' – im zweiten Anlauf'}.</strong><div class="steps"><div>${sym(f,t)} = ${tex(f,f.s[t][0])}</div><div class="note">Probe mit Zahlen: ${sym(f,t)} = ${num(f,f.s[t][0],v)} = ${F(v[t])}${unit(f,t)}</div></div>${f.note?`<div class="note">${f.note}</div>`:''}</div>`;
      finish(true,first)}
    else{inp.classList.add('bad');if(first)record(false,f.g,f.id);
      $('#fb').innerHTML=`<div class="fb bad"><strong>Noch nicht richtig.</strong> ${res.msg||'Deine Formel ergibt andere Werte.'} Versuch es nochmal – oder hol dir einen 💡 Tipp.</div>`}};
  if(!isTouch())setTimeout(()=>inp.focus({preventScroll:true}),0);
}

/* ---------- Mittel: umstellen und ausrechnen ---------- */
function renderMid(){
  const {f,target:t,v}=st.cur,c=$('#card'),gk=Object.keys(f.v).filter(k=>k!==t);
  const steps=umSteps(f,t).concat([{txt:'Zahlen mit Einheiten einsetzen.',eq:`${sym(f,t)} = ${num(f,f.s[t][0],v)}`}]);
  let shown=st.guided?steps.length:0;
  c.innerHTML=head(f.g,`${f.name} · Mittel · ${mode()}`)+
   `<p class="task">Berechne <b>${sym(f,t)}</b> (${f.v[t][0]}).</p><div class="fx">${tex(f,f.eq)}</div>
    <div class="given">${gk.map(k=>`<div><span class="n">${f.v[k][0]}</span><span class="v">${sym(f,k)} = ${FG(v[k])}${unit(f,k)}</span></div>`).join('')}</div>
    <div id="guide"></div>
    <form class="ans" id="frm" autocomplete="off"><div class="inp big"><label for="a0">${sym(f,t)} =</label><input id="a0" inputmode="decimal" autocomplete="off" placeholder="Ergebnis"><span class="u">${f.v[t][1]}</span></div>
    ${bottomRow()}</form><div id="fb"></div>`;
  const inp=$('#a0');
  const showGuide=()=>{$('#guide').innerHTML=shown?`<div class="guide"><p class="lbl">${st.guided?'Schritt für Schritt':'Tipp'}</p>${stepList(steps.slice(0,shown))}${shown===steps.length?'<p class="note">Jetzt nur noch in den Taschenrechner tippen und das Ergebnis unten eintragen.</p>':''}</div>`:''};
  showGuide();
  $('#tip').onclick=()=>{if(shown<steps.length){shown++;showGuide()}else $('#fb').innerHTML=`<div class="fb info">Alle Schritte stehen schon da. Rechne den letzten Ausdruck mit dem Taschenrechner aus.</div>`};
  const sol=ok=>`<div class="steps"><div>umgestellt: ${sym(f,t)} = ${tex(f,f.s[t][0])}</div><div>eingesetzt: ${sym(f,t)} = ${num(f,f.s[t][0],v)}</div><div>Ergebnis: <b>${sym(f,t)} = ${F(v[t])}${unit(f,t)}</b></div></div>${f.note?`<div class="note">${f.note}</div>`:''}`;
  $('#sol').onclick=()=>{shown=steps.length;showGuide();$('#fb').innerHTML=`<div class="fb bad"><strong>Lösung</strong>${sol()}</div>`;finish(false,st.tries===0)};
  $('#skip').onclick=next;
  $('#frm').onsubmit=e=>{e.preventDefault();if(st.done){next();return}
    const a=parseNum(inp.value);if(!isFinite(a)){$('#fb').innerHTML=`<div class="fb info">Gib eine Zahl ein, z. B. 12,5.</div>`;inp.focus();return}
    const first=st.tries===0;st.tries++;const ok=near(a,v[t]);
    if(ok){inp.classList.remove('bad');inp.classList.add('ok');shown=steps.length;showGuide();$('#fb').innerHTML=`<div class="fb ok"><strong>Richtig${first?'':' – im zweiten Anlauf'}.</strong>${sol()}</div>`;finish(true,first)}
    else{inp.classList.add('bad');if(first)record(false,f.g,f.id);$('#fb').innerHTML=`<div class="fb bad"><strong>Noch nicht richtig.</strong> Prüf die Umstellung und die Einheiten – oder hol dir einen 💡 Tipp.</div>`}};
  if(!isTouch())setTimeout(()=>inp.focus({preventScroll:true}),0);
}

/* ---------- Schwer: Rechenketten ---------- */
function renderHard(){
  const {g,t}=st.cur,c=$('#card'),H=hintFor(t.t);
  c.innerHTML=head(g,`${t.ref} · Schwer · ${mode()}`)+`<p class="task"><b>${t.t}</b></p><div>${t.text}</div>
   <form class="ans" id="frm" autocomplete="off">${t.parts.map((p,i)=>`<div class="part"><div class="inp"><label for="a${i}">${String.fromCharCode(97+i)}) ${p.q} =</label><input id="a${i}" inputmode="decimal" autocomplete="off"><span class="u">${p.u}</span>${st.guided?'':`<button type="button" class="mini ptip" data-i="${i}">💡 Tipp</button>`}</div><div class="phint" id="h${i}"${st.guided?'':' hidden'}>${H[i]?`<span class="ex">${H[i]}</span>`:''}</div><div id="s${i}"></div></div>`).join('')}
   ${bottomRow()}</form><div id="fb"></div>`;
  c.querySelectorAll('.ptip').forEach(b=>b.onclick=()=>{$('#h'+b.dataset.i).hidden=false;b.hidden=true});
  $('#tip').onclick=()=>{const i=t.parts.findIndex((p,k)=>$('#h'+k).hidden);if(i<0){$('#fb').innerHTML=`<div class="fb info">Alle Tipps sind schon offen.</div>`;return}$('#h'+i).hidden=false;const b=c.querySelector(`.ptip[data-i="${i}"]`);if(b)b.hidden=true};
  const showAll=()=>t.parts.forEach((p,i)=>{$('#s'+i).innerHTML=`<div class="fb ${$('#a'+i).classList.contains('ok')?'ok':'bad'}"><div class="steps">${p.steps.map(s=>`<div>${s}</div>`).join('')}<div>→ <b>${F(p.a)}${p.u?' '+p.u:''}</b></div></div></div>`});
  $('#sol').onclick=()=>{showAll();finish(false,st.tries===0)};
  $('#skip').onclick=next;
  if(!isTouch())setTimeout(()=>$('#a0').focus({preventScroll:true}),0);
  $('#frm').onsubmit=e=>{e.preventDefault();if(st.done){next();return}
    const first=st.tries===0;st.tries++;let n=0;
    t.parts.forEach((p,i)=>{const el=$('#a'+i),a=parseNum(el.value),ok=near(a,p.a,p.tol);if(ok){n++;el.classList.remove('bad');el.classList.add('ok');el.readOnly=true}else el.classList.add('bad')});
    const all=n===t.parts.length;
    if(all){showAll();$('#fb').innerHTML=`<div class="fb ok"><strong>Alle ${n} richtig${first?'':' – im zweiten Anlauf'}.</strong></div>`;finish(true,first)}
    else{if(first)record(false,g,null);$('#fb').innerHTML=`<div class="fb bad"><strong>${n} von ${t.parts.length} richtig.</strong> Die roten Felder kannst du nochmal versuchen – oder 💡 Tipp bzw. „Lösung zeigen“.</div>`}};
}
function renderTraps(g){const G=GMAP[g],el=$('#traps');const op=el.open;el.hidden=false;el.style.setProperty('--bc',`var(--b-${G.b})`);
  el.innerHTML=`<summary>Fallen und Merksätze · ${G.e} ${G.id} ${G.sn}</summary><h4>${G.name}</h4><p>${G.d}${G.pts?` <span class="note">· ${G.n} Prüfungsaufgaben, ${G.pts} Punkte</span>`:''}</p><ul>${G.t.map(x=>`<li>${x}</li>`).join('')}</ul>`;el.open=op}

/* ---------- Formelblatt ---------- */
function buildSheet(){
  $('#sheetBody').innerHTML=`<p class="note">Alle Formeln mit jeder Umstellung, nach Blöcken und Themen sortiert.</p>`+
   BLOCKS.map(B=>`<h2 class="bh">${B.e} ${B.name} <span class="note">${B.avg}</span></h2>`+GROUPS.filter(G=>G.b===B.id).map(G=>{const fs=FX.filter(f=>f.g===G.id);return `<section class="sgroup"><h3><span class="tag" style="--bc:var(--b-${G.b})">${G.id}</span>${G.e} ${G.name}${G.pts?`<span class="pt">${G.pts} Punkte · ${G.n} Aufgaben</span>`:''}</h3><p>${G.d}</p>
    ${fs.map(f=>{const rhs=f.eq.split(' = ')[1],tg=Object.keys(f.s).filter(k=>f.s[k][0]!==rhs);
      return `<div class="frm"><div class="fn">${f.name}${f.sub?`<small>${f.sub}</small>`:''}</div><div class="fl"><span class="main">${tex(f,f.eq)}</span>${tg.map(k=>`<span>${sym(f,k)} = ${tex(f,f.s[k][0])}</span>`).join('')}</div></div>`}).join('')}</section>`}).join('')).join('');
}

/* ---------- Fortschritt ---------- */
function buildProg(){
  $('#progList').innerHTML=GROUPS.map(G=>{const s=stats[G.id]||{r:0,w:0},n=s.r+s.w,pr=n?Math.round(s.r/n*100):0;
    return `<div class="pr"><span class="tag" style="--bc:var(--b-${G.b})">${G.id}</span><div class="bar" title="${G.name}"><i class="g" style="width:${n?s.r/n*100:0}%"></i><i class="r" style="width:${n?s.w/n*100:0}%"></i></div><span>${n?`${s.r} / ${n} · ${pr} %`:'noch nichts'}</span></div>`}).join('');
}
$('#examDate').value=store.get('exam','2026-11-03');
$('#examDate').onchange=e=>{if(e.target.value){store.set('exam',e.target.value);updHead()}};
let resetArm=false;
$('#reset').onclick=()=>{if(!resetArm){resetArm=true;$('#reset').textContent='Wirklich löschen?';$('#resetNote').textContent='Noch einmal klicken, um alle Zähler zu löschen.';return}
  stats={};fst={};day={d:today,r:0,w:0};store.set('stats',stats);store.set('fst',fst);store.set('day',day);resetArm=false;
  $('#reset').textContent='Fortschritt zurücksetzen';$('#resetNote').textContent='Gelöscht.';buildProg();updHead()};

/* ---------- Ansichten und Farbmodus ---------- */
const LVN={1:'Leicht',2:'Mittel',3:'Schwer'};
function show(v){for(const t of ['start','train','sheet','prog'])$('#v-'+t).hidden=t!==v;if(v==='prog')buildProg();window.scrollTo(0,0)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#go').onclick=()=>{if(!st.sel.size){$('#hint').textContent='Wähl mindestens ein Thema aus.';return}
  $('#trainInfo').textContent=`${LVN[st.lv]} · ${st.guided?'geführt':'selbst'} · ${st.sel.size} Themen`;show('train');next()};
function applyMode(m){document.documentElement.dataset.mode=m;setPressed('.th','th',m)}
let theme=store.get('mode','dark');applyMode(theme);
document.querySelectorAll('.th').forEach(b=>b.onclick=()=>{theme=b.dataset.th;store.set('mode',theme);applyMode(theme)});

buildTopics();buildSheet();updHead();
</script>
